<div class="page-wrap">
    <div class="menu-sec">
        <app-menu [userDetails]="userDetails"></app-menu>
    </div>
    <div class="main-page">
        <div class="header">
            <app-header [userDetails]="userDetails" (togglePanel)="toggleRightPanel()"></app-header>
        </div>
        <div class="content-row">
            <div class="page-content">
                <router-outlet></router-outlet>
            </div>
            <div class="right-panel-wrap" [class.open]="rightPanelOpen">
                <app-right-panel></app-right-panel>
            </div>
        </div>
    </div>
    <div class="panel-backdrop" [class.visible]="rightPanelOpen" (click)="rightPanelOpen = false"></div>
</div>
